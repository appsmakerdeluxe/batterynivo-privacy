<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADB5"/>
      <stop offset="100%" stop-color="#006670"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E9F2"/>
      <stop offset="100%" stop-color="#00ADB5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0B131A"/>
  <!-- Outer Glow Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00ADB5" stroke-width="20" stroke-linecap="round" stroke-dasharray="848" stroke-dashoffset="210" opacity="0.85"/>
  <!-- Outer Background Ring Track -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#223445" stroke-width="12" stroke-linecap="round" stroke-dasharray="848" stroke-dashoffset="210" opacity="0.4"/>
  <!-- Center Battery Body -->
  <rect x="200" y="166" width="112" height="180" rx="24" fill="none" stroke="url(#cyanGrad)" stroke-width="14"/>
  <!-- Battery Terminal / Cap -->
  <rect x="232" y="142" width="48" height="16" rx="8" fill="#00ADB5"/>
  <!-- Dynamic Lightning / Energy Pulse -->
  <path d="M266 210 L234 266 L262 266 L246 312 L284 250 L256 250 Z" fill="url(#pulseGrad)"/>
</svg>
